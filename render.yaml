# Render Blueprint: native Python runtime, no Docker.
# The build installs the backend, then builds the React app that FastAPI serves.
services:
  - type: web
    name: samajsevak
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 22.20.0
      - key: OFFICER_USER
        value: officer
      - key: OFFICER_PASSWORD
        sync: false
      # password of every department-head and strike-body login; without it (and with
      # OFFICER_PASSWORD set) only the officer account exists
      - key: STAFF_PASSWORD
        sync: false
      - key: SAMAJSEVAK_SECRET
        generateValue: true
      # the free plan has 512 MB RAM; the embedding model needs about that much on its own.
      # Set to "1" on a plan with 1 GB or more.
      - key: SAMAJSEVAK_EMBEDDINGS
        value: "0"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
